<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Progress Bar</title>

  <style>
    .progress-container {
      width: 100px;
      height: 100px;
      position: relative;
    }

    .progress-container svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .progress-background,
    .progress-bar {
      fill: none;
      stroke-width: 12;
    }

    .progress-background {
      stroke: #e5e7eb;
    }

    .progress-bar {
      stroke: #2563eb;
      stroke-linecap: round;
      stroke-dasharray: 0 100;
      transition: stroke-dasharray 1s ease;
    }

    .progress-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: bold 28px Arial, sans-serif;
      color: #1f2937;
    }
  </style>
</head>
<body>

  <div class="progress-container">
    <svg viewBox="0 0 100 100">
      <circle
        class="progress-background"
        cx="50"
        cy="50"
        r="40"
        pathLength="100"
      />

      <circle
        id="progressBar"
        class="progress-bar"
        cx="50"
        cy="50"
        r="40"
        pathLength="100"
      />
    </svg>

  </div>

  <script>
    const progressBar = document.getElementById("progressBar");

    function setProgress(targetPercentage, duration = 1000) {
      const percentage = Math.max(0, Math.min(100, targetPercentage));

      progressBar.style.transition = `stroke-dasharray ${duration}ms ease`;
      progressBar.style.strokeDasharray = `${percentage} 100`;
    }

    // Example: animate to 75%
    setProgress(75);
  </script>

</body>
</html>
